name: Team Lab release gate

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-artifact:
    name: Verify public artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      public_artifact_id: ${{ steps.upload_public_artifact.outputs['artifact-id'] }}
      public_artifact_url: ${{ steps.upload_public_artifact.outputs['artifact-url'] }}
      public_artifact_digest: ${{ steps.upload_public_artifact.outputs['artifact-digest'] }}

    defaults:
      run:
        working-directory: team-lab

    env:
      CI: "true"
      TEAMLAB_CHROME_PATH: /usr/bin/google-chrome
      VITE_BASE_PATH: /

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: team-lab/package-lock.json

      - name: Validate workflow security
        run: npm run validate:workflows

      - name: Install locked dependencies
        run: npm ci

      - name: Audit locked dependencies
        run: npm run audit:security

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run MVP scale characterization
        run: npm run test:scale

      - name: Validate bundled PvPoke data
        run: npm run validate:data

      - name: Build public artifact
        run: npm run build

      - name: Test exact production artifact
        run: npm run test:production:artifact

      - name: Reject maintainer artifact
        run: test ! -e dist-admin

      - name: Upload verified public artifact
        id: upload_public_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: team-lab-public-${{ github.sha }}
          path: team-lab/dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
          include-hidden-files: false

  deploy-cloudflare:
    name: Deploy verified artifact to Cloudflare Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: verify-public-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.deployment-url }}
    outputs:
      origin: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download exact verified public artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: team-lab-public-${{ github.sha }}
          path: team-lab/dist

      - name: Confirm only the public static artifact is present
        working-directory: team-lab
        run: |
          test -f dist/index.html
          test -f dist/release.json
          test ! -e dist/404.html
          test ! -e dist/_worker.js
          test ! -e dist-admin

      - name: Deploy exact public artifact to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: team-lab
          wranglerVersion: "4.114.0"
          command: >-
            pages deploy dist
            --project-name=pvpoke-team-lab
            --branch=master
            --commit-hash=${{ github.sha }}
            --commit-dirty=false

  verify-deployment:
    name: Verify production deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: deploy-cloudflare
    permissions:
      contents: read
    uses: ./.github/workflows/team-lab-deployment-check.yml
    with:
      origin: ${{ needs.deploy-cloudflare.outputs.origin }}
      expected_commit: ${{ github.sha }}
