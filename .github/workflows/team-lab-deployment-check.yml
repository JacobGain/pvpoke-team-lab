name: Team Lab deployment check

on:
  workflow_call:
    inputs:
      origin:
        description: HTTPS origin root containing the deployed Team Lab artifact
        required: true
        type: string
      expected_commit:
        description: Git commit expected in the deployed release metadata
        required: true
        type: string
  workflow_dispatch:
    inputs:
      origin:
        description: HTTPS origin root containing the deployed Team Lab artifact
        required: true
        type: string
      expected_commit:
        description: Git commit expected in the deployed release metadata
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.origin }}
  cancel-in-progress: true

jobs:
  verify-deployed-origin:
    name: Verify deployed origin
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: team-lab

    env:
      CI: "true"
      TEAMLAB_CHROME_PATH: /usr/bin/google-chrome
      TEAMLAB_DEPLOYMENT_ORIGIN: ${{ inputs.origin }}
      TEAMLAB_EXPECTED_COMMIT_SHA: ${{ inputs.expected_commit || github.sha }}

    steps:
      - name: Check out verification source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: team-lab/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Require an HTTPS deployment origin
        run: |
          case "$TEAMLAB_DEPLOYMENT_ORIGIN" in
            https://*) ;;
            *)
              echo "Deployment verification requires an HTTPS origin root."
              exit 1
              ;;
          esac

      - name: Exercise deployed public artifact
        run: npm run test:deployment -- --origin="$TEAMLAB_DEPLOYMENT_ORIGIN"
